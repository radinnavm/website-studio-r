<!doctype html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <title>Website Studio R — Изработка на сайтове и онлайн магазини</title>
    <meta
      name="description"
      content="Website Studio R изработва модерни сайтове и онлайн магазини за бизнеси в България — дизайн, разработка, SEO и дългосрочна поддръжка."
    />
    <meta name="theme-color" content="#F7F4EF" />
    <meta
      name="google-site-verification"
      content="nr-2xyINhxK8m-9jETzyeaNytfCTmSu7s9Mm3v4zGUM"
    />

    <!--
      This is the SPA shell. During `vite build` the `server/prerender.ts`
      plugin overwrites it with per-route HTML that carries the correct,
      locale-specific <title>, description, canonical, hreflang, robots, OG and
      Twitter metadata plus JSON-LD. After hydration, client-side navigation
      keeps the head in sync via `useSeo`/`applySeo` in src/lib/seo.ts.
      The `robots` directive is intentionally NOT hardcoded here so that
      noindex pages (e.g. /politika-za-poveritelnost, 404) can never be served
      with a misleading static `index, follow`.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Website Studio R" />
    <meta property="og:locale" content="bg_BG" />
    <meta
      property="og:title"
      content="Website Studio R — Изработка на сайтове и онлайн магазини"
    />
    <meta
      property="og:description"
      content="Website Studio R изработва модерни сайтове и онлайн магазини за бизнеси в България — дизайн, разработка, SEO и дългосрочна поддръжка."
    />
    <meta
      property="og:image"
      content="https://www.websitestudior.bg/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Website Studio R — изработка на сайтове и онлайн магазини за бизнеси в България"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Website Studio R — Изработка на сайтове и онлайн магазини"
    />
    <meta
      name="twitter:description"
      content="Website Studio R изработва модерни сайтове и онлайн магазини за бизнеси в България."
    />
    <meta
      name="twitter:image"
      content="https://www.websitestudior.bg/og-image.png"
    />
  </head>
  <body>
    <noscript>
      <p
        style="
          margin: 0;
          padding: 1.5rem;
          font-family: sans-serif;
          background: #f7f4ef;
          color: #1c1b19;
        "
      >
        Този сайт изисква JavaScript. Можете да се свържете с нас на
        hello@websitestudior.bg.
      </p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
